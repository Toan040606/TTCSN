spring:
  application:
    name: bachmai-appointment-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/bachmai;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}

app:
  jwt-secret: ${JWT_SECRET:bach-mai-appointment-system-secret-key-2026-change-in-production}
  jwt-expiration-ms: 28800000
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
